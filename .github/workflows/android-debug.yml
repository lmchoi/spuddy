name: Android Pre-release APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to build'
        default: 'main'
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Android project
        run: APP_VARIANT=prerelease npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spuddy-prerelease-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  e2e:
    needs: build
    uses: ./.github/workflows/e2e.yml
    with:
      gha_run_id: ${{ github.run_id }}
      app_id: com.mchoi.spuddy.prerelease
    secrets: inherit

name: Android Pre-release APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to build'
        default: 'main'
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: spuddy-prerelease-${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Android project
        run: APP_VARIANT=prerelease npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spuddy-prerelease-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: ⚡ Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 📥 Download APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: apk/

      - name: 🤖 Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | MAESTRO_VERSION=2.6.1 bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: 📱 Run E2E flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: |
            adb install apk/app-release.apk
            bash e2e/seed.sh com.mchoi.spuddy.prerelease
            maestro test --env APP_ID=com.mchoi.spuddy.prerelease --debug-output /tmp/maestro-debug e2e/*.yaml

      - name: 📸 Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-${{ github.run_number }}
          path: /tmp/maestro-debug
          if-no-files-found: ignore

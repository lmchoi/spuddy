name: EAS Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0)'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk-url: ${{ steps.eas-build.outputs.apk-url }}

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏷 Set app version from git tag
        run: |
          VERSION=${{ inputs.version || github.ref_name }}
          VERSION=${VERSION#v}
          jq --arg v "$VERSION" '.expo.version = $v' app.json > app.json.tmp && mv app.json.tmp app.json
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          echo "Building version $VERSION"

      - name: 🚀 Build APK via EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🔨 Run EAS build
        id: eas-build
        run: |
          BUILD_JSON=$(eas build --platform android --profile preview --non-interactive --json)
          APK_URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.buildUrl')
          echo "apk-url=$APK_URL" >> $GITHUB_OUTPUT

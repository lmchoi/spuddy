appId: ${APP_ID}
---
- launchApp:
    clearState: false
- tapOn: "Add workout"
- tapOn: "Legs"
- tapOn: "Start Legs"
- assertVisible: "Squat"

# Tap the pill to open the name sheet
- tapOn: "+ Add exercise"
- assertVisible: "Add exercise"
- assertVisible: "Exercise name"

# Enter a name and confirm via Create row
- tapOn: "Exercise name"
- setClipboard: "Cable Fly"
- pasteText
- hideKeyboard
- tapOn: "Create 'Cable Fly'"
- assertNotVisible: "Exercise name"

# New chip appears in the exercise strip
- assertVisible: "Cable Fly"

# Log a set for the new exercise
- tapOn: "Done · Last set"
- assertVisible: "Set 1"
- assertVisible: "10 × 0 kg"

appId: ${APP_ID}
---
- launchApp:
    clearState: false

# Navigate to select-day via Add tab
- tapOn: "Add workout"
- assertVisible: "Choose day"

# Pill strip shows all 3 days
- assertVisible: "Push"
- assertVisible: "Pull"
- assertVisible: "Legs"

# First day is active and shown as Next up
- assertVisible: "Next up"
- assertVisible: "Bench press"

# Switch to Pull day
- tapOn: "Pull"
- assertVisible: "Lat pulldown"

# Switch to Legs day and start
- tapOn: "Legs"
- assertVisible: "Squat"
- tapOn: "Start Legs"
- assertVisible: "Legs"

appId: ${APP_ID}
---
- launchApp
- waitForAnimationToEnd:
    timeout: 10000
- tapOn: "Settings"
- assertVisible: "Settings"
- takeScreenshot: baseline-settings
- tapOn: "Progress"
- assertVisible: "Progress"
- takeScreenshot: baseline-progress
- tapOn: "Add workout"
- takeScreenshot: baseline-log-session
- back
